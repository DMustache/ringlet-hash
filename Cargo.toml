[package]
name = "ringlet-hash"
version = "0.1.0"
edition = "2024"
authors = ["Dmitry Usakov"]
description = "Consistent hashing with weighted nodes and cluster migration previews"
repository = "https://github.com/DMustache/ringlet"
readme = "README.md"
license = "MIT OR Apache-2.0"

[dependencies]

[dev-dependencies]
murmur3 = "0.5.2"
criterion = "0.8.2"

[[bench]]
name = "ring_bench"
harness = false

[profile.bench]
opt-level = 0
debug = true
strip = false
