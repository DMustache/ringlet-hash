[package]
name = "ringlet-hash"
version = "0.2.1"
edition = "2024"
authors = ["Dmitry Usakov"]
description = "Consistent hashing with weighted nodes and cluster migration previews"
keywords = ["consistent-hashing", "hash-ring", "load-balancing", "sharding", "distributed"]
categories = ["data-structures", "algorithms"]
repository = "https://github.com/DMustache/ringlet"
documentation = "https://docs.rs/ringlet-hash/latest/ringlet_hash"
readme = "README.md"
license = "MIT OR Apache-2.0"

[dependencies]

[dev-dependencies]
murmur3 = "0.5.2"
criterion = "0.8.2"

[[bench]]
name = "ring_bench"
harness = false

[profile.bench]
opt-level = 0
debug = true
strip = false
